name: CI - Build e Testes

on:
  push:
    branches:
      - main
      - feature/lint

  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: supportflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d supportflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: supportflow

    env:
      DB_URL: jdbc:postgresql://localhost:5432/supportflow
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar build e testes
        run: ./mvnw clean test

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
    
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: supportflow

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar o Checkstyle
        run: ./mvnw checkstyle:check -Dcheckstyle.config.location=../checkstyle.xml