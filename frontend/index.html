<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportFlow - Acesso</title>
    <!-- CSS Global (Compartilhado) -->
    <link rel="stylesheet" href="styles/global.css">
    <!-- CSS Específico de Autenticação -->
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="auth-container">
        
        <!-- Tela de Login -->
        <div id="login-screen" class="form-section">
            <div class="header">
                <h2>Bem-vindo ao SupportFlow</h2>
                <p>Faça login para acessar seus chamados.</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" placeholder="Seu e-mail cadastrado">
                    <span class="error-message" id="login-email-error"></span>
                </div>
                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" placeholder="Sua senha">
                    <span class="error-message" id="login-password-error"></span>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
                <p class="toggle-text">Não tem uma conta? <a href="#" id="go-to-register">Cadastre-se</a></p>
            </form>
        </div>

        <!-- Tela de Cadastro -->
        <div id="register-screen" class="form-section hidden">
            <div class="header">
                <h2>Criar Conta</h2>
                <p>Cadastre-se no SupportFlow.</p>
            </div>
            <form id="register-form">
                <div class="input-group">
                    <label for="register-name">Nome completo</label>
                    <input type="text" id="register-name" placeholder="Seu nome">
                    <span class="error-message" id="register-name-error"></span>
                </div>
                <div class="input-group">
                    <label for="register-email">E-mail</label>
                    <input type="email" id="register-email" placeholder="Seu e-mail">
                    <span class="error-message" id="register-email-error"></span>
                </div>
                <div class="input-group">
                    <label for="register-password">Senha</label>
                    <input type="password" id="register-password" placeholder="Crie uma senha">
                    <span class="error-message" id="register-password-error"></span>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
                <p class="toggle-text">Já possui uma conta? <a href="#" id="go-to-login">Fazer login</a></p>
            </form>
        </div>

    </div>
    
    <!-- JS Específico de Autenticação -->
    <script src="js/auth.js"></script>
</body>
</html>
